name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite correrlo manualmente desde la pestaña Actions

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore ProyectoSGIO/ProyectoSGIO.sln

      - name: Compilar solución
        run: dotnet build ProyectoSGIO/ProyectoSGIO.sln --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test ProyectoSGIO/ProyectoSGIO.sln --no-build --configuration Release
